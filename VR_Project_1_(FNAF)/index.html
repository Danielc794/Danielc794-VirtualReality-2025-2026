<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazbears Pizza - New Dawn</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <script src="mapConfig.js"></script>
    <script src="bonnie.js"></script>
    <script src="camera.js"></script>
    <script src="camerasystem.js"></script>
    <script src="chica.js"></script>
    <script src="computer.js"></script>
    <script src="foxy.js"></script>
    <script src="freddy.js"></script>
    <script src="script.js"></script>
    
    <a-scene physics="gravity: -9.8">
      <a-assets>
        <!-- Main Map Model -->
        <a-asset_item id="mapModel" src="fazbears_pizza__new_dawn/scene.gltf"></a-asset_item>
        <!-- Foxy model for Pirate Cove -->
        <a-asset_item id="foxyModel" src="foxy/scene.gltf"></a-asset_item>
        <!-- Stage animatronics -->
        <a-asset_item id="freddyModel" src="freddy/scene.gltf"></a-asset_item>
        <a-asset_item id="bonnieModel" src="bonnie/scene.gltf"></a-asset_item>
        <a-asset_item id="chicaModel" src="chica/scene.gltf"></a-asset_item>
        <audio id="ambience2Audio" src="ambience2.wav" preload="auto"></audio>
        <audio id="xscreamAudio" src="XSCREAM.wav" preload="auto"></audio>
        <img id="foxyJumpscareImg" src="foxy_jumpscare.jpg">
      </a-assets>

      <!-- Lighting -->
      <a-light type="ambient" intensity="0.4" color="#ffffff"></a-light>
      <a-light type="directional" intensity="0.6" position="5 10 7" color="#ffffff"></a-light>

      
      
      <!-- Environment -->
      <a-sky color="Black"></a-sky>
      
      <!-- Main Map Model - Fazbears Pizza New Dawn -->
      <a-entity id="pizzaMap">
        <a-gltf-model 
          id="map" 
          src="#mapModel" 
          position="0 0 0" 
          scale="1 1 1"
          animation__rotation="property: rotation; to: 0 360 0; loop: false; dur: 0">
        </a-gltf-model>
      </a-entity>

      <!-- Foxy in Pirate Cove -->
      <a-entity
        id="foxy"
        gltf-model="#foxyModel"
        position="-10.5 0.5 -18"
        rotation="0 90 0"
        scale="0.025 0.025 0.025">
      </a-entity>
      <!-- Stage animatronics on stage-->
      <a-entity
        id="freddy"
        gltf-model="#freddyModel"
        position="1.5 0.5 -32"
        rotation="0 0 0"
        scale="0.04 0.04 0.04">
      </a-entity>

      <a-entity
        id="bonnie"
        gltf-model="#bonnieModel"
        position="0 0.5 -32.5"
        rotation="0 0 0"
        scale="0.04 0.04 0.04">
      </a-entity>

      <a-entity
        id="chica"
        gltf-model="#chicaModel"
        position="-1.5 0.5 -33"
        rotation="0 0 0"
        scale="0.04 0.04 0.04">
      </a-entity>
      <!-- Camera with collision detection -->
      <a-camera 
        id="mainCamera"
        position="0 1.6 2.5" 
        zoom="2.6"
        camera="active: true"
        movement-controls="enabled: false"
        wasd-controls="enabled: false"
        look-controls="enabled: true; pointerLockEnabled: true"
        rotation-constraint__pitch="min: 0; max: 0"
        rotation-constraint__yaw="min: -360; max: 360">
        <a-entity
          id="ambience2Loop"
          sound="src: #ambience2Audio; autoplay: true; loop: true; positional: false; volume: 0.6">
        </a-entity>
        <!-- <a-entity 
          id="reticle"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: white; shader: flat"
          position="0 0 -1"
          scale="0.5 0.5 0.5">
        </a-entity> -->
        <a-text 
          id="output" 
          position="-1 0.75 -1"
          value="Welcome to Fazbears Pizza - New Dawn"
          scale="0.5 0.5 0.5"
          color="white">
        </a-text>
        <a-text
          id="timeDisplay"
          position=".65 0.45 -1.5"
          value="MAIN CAMERA"
          align="left"
          color="#00FFFF"
          scale="0.15 0.15 0.15">
        </a-text>
        <a-text
          id="powerDisplay"
          position="-.65 -0.37 -1.5"
          value="POWER: 100%"
          align="right"
          color="#00FFFF"
          scale="0.15 0.15 0.15">
        </a-text>
        <a-text
          id="usageDisplay"
          position="-.72 -0.42 -1.5"
          value="USAGE: 0"
          align="right"
          color="#00FFFF"
          scale="0.15 0.15 0.15">
        </a-text>
        <a-image
          id="foxyJumpscare"
          src="#foxyJumpscareImg"
          position="0 0 -1.5"
          width="2"
          height="2"
          visible="false">
        </a-image>
      </a-camera>

      <!-- Interactive UI/Text Elements -->
      <a-plane 
        id="infoPanel"
        position="0 2 -3"
        rotation="0 0 0"
        width="1"
        height="0.75"
        material="color: #333333; opacity: 0.8"
        text="value: FNAF1 Recreation\n\nQ - Lights\nE - Doors\nSpacebar/C - Cameras\nL - Change Lighting\nCTRL+R - Restart; anchor: center; align: center; color: #ffffff; fontSize: 32">
      </a-plane>

      <!-- Camera Mode Indicator -->
      <a-entity id="cameraModeIndicator" position="0 0 0" visible="false">
        <a-plane width="1" height="0.3" material="color: #FF0000; opacity: 0.8"></a-plane>
        <a-text value="CAMERA MODE" color="#FFFFFF" align="center" position="0 0 0.01" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Ground plane for reference -->
      <a-plane 
        id="groundReference"
        position="0 -5 0"
        rotation="-90 0 0"
        width="50"
        height="50"
        material="color: #222222; opacity: 0.3"
        visible="true">
      </a-plane>

      <!-- Foxy Jumpscare Display -->
      <a-image
        id="foxyJumpscare"
        src="#foxyJumpscareImg"
        position="0 0 -2"
        width="2"
        height="2"
        visible="false">
      </a-image>

      <!-- Foxy Jumpscare Sound -->
      <a-entity
        id="xscreamSound"
        sound="src: #xscreamAudio; autoplay: false; loop: false; positional: false; volume: 1">
      </a-entity>

      <!-- Light on the Left -->
      <a-box
        id="leftLight"
        position="-1.95 1 0"
        rotation="0 90 0"
        width="1.2"
        height="2.5"
        depth="0.1"
        material="color: #000000">
      </a-box>

      <!-- Door on the Left -->
      <a-entity id="leftDoor" position="-1.95 6 0" rotation="0 90 0">
        <a-box
          position="0 0 0"
          rotation="0 0 0"
          width="1.2"
          height="2.5"
          depth="0.1"
          material="color: #808080; metalness: 0.8; roughness: 0.2">
        </a-box>
        <!-- Wheel-type handle (torus ring) -->
        <a-torus
          position="0.4 0 0.06"
          radius="0.08"
          radius-tubular="0.02"
          rotation="90 0 0"
          material="color: #C0C0C0; metalness: 0.9; roughness: 0.1">
        </a-torus>
        <!-- Handle spokes -->
        <a-cylinder
          position="0.4 0.06 0.06"
          radius="0.01"
          height="0.12"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <a-cylinder
          position="0.4 -0.06 0.06"
          radius="0.01"
          height="0.12"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <a-cylinder
          position="0.405 0 0.06"
          radius="0.01"
          height="0.12"
          rotation="0 0 90"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <!-- Lock plate -->
        <a-box
          position="0.4 0.2 0.06"
          width="0.2"
          height="0.3"
          depth="0.01"
          material="color: #C0C0C0">
        </a-box>
        <!-- Secure sign -->
        <a-text
          value="SECURE"
          position="0 0.8 0.06"
          align="center"
          color="#FF0000"
          scale="0.3 0.3 0.3">
        </a-text>
      </a-entity>

      <!-- Light on the Right -->
      <a-box
        id="rightLight"
        position="1.95 1 0"
        rotation="0 90 0"
        width="1.2"
        height="2.5"
        depth="0.1"
        material="color: #000000">
      </a-box>

      <!-- Door on the Right -->
      <a-entity id="rightDoor" position="1.95 6 0" rotation="0 -90 0">
        <a-box
          position="0 0 0"
          rotation="0 0 0"
          width="1.2"
          height="2.5"
          depth="0.1"
          material="color: #808080; metalness: 0.8; roughness: 0.2">
        </a-box>
        <!-- Wheel-type handle (torus ring) -->
        <a-torus
          position="0.4 0 0.06"
          radius="0.08"
          radius-tubular="0.02"
          rotation="90 0 0"
          material="color: #C0C0C0; metalness: 0.9; roughness: 0.1">
        </a-torus>
        <!-- Handle spokes -->
        <a-cylinder
          position="0.4 0.06 0.06"
          radius="0.01"
          height="0.12"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <a-cylinder
          position="0.4 -0.06 0.06"
          radius="0.01"
          height="0.12"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <a-cylinder
          position="0.405 0 0.06"
          radius="0.01"
          height="0.12"
          rotation="0 0 90"
          material="color: #A9A9A9; metalness: 0.8">
        </a-cylinder>
        <!-- Lock plate -->
        <a-box
          position="0.4 0.2 0.06"
          width="0.2"
          height="0.3"
          depth="0.01"
          material="color: #C0C0C0">
        </a-box>
        <!-- Secure sign -->
        <a-text
          value="SECURE"
          position="0 0.8 0.06"
          align="center"
          color="#FF0000"
          scale="0.3 0.3 0.3">
        </a-text>
      </a-entity>

    </a-scene>
  </body>
</html>
